[package]
name = "pulsen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
pulsen-domain.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"

[dev-dependencies]
pulsen-conformance.workspace = true

# Windows のデタッチ起動だけは Win32 の呼び出しを要するため、workspace の `forbid` を
# 継承せず `deny` にする。緩められるのはこのクレートだけで、許可は `adapter::process` の
# `inheritance` モジュールに閉じる(ADR-100)。
[lints.rust]
unsafe_code = "deny"
